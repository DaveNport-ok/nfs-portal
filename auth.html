<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFS Portal | Login</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-page">

<div class="cover-noise"></div>

<div class="bg-game-title">NEED FOR SPEED</div>

<div class="auth-box">
  <!-- Заголовок формы для функции toggleForm() -->
  <h2 id="formTitle" style="color: var(--nfs-yellow, #f1c40f); margin-top: 0; text-transform: uppercase; font-style: italic; letter-spacing: 1px;">
    Enter the game
  </h2>

  <div id="errorMsg" class="error" style="display: none;"></div>

  <div id="authFields">
    <input
      type="email"
      id="email"
      placeholder="E-mail"
      autocomplete="email"
    >
    <input
      type="text"
      id="username"
      placeholder="Your nickname"
      autocomplete="username"
      style="display: none;"
    >
    <input
      type="password"
      id="password"
      minlength="8"
      maxlength="12"
      placeholder="Password (8-12 chars)"
      autocomplete="current-password"
    >
  </div>

  <button class="btn btn-primary" id="mainBtn" onclick="handleAuth()">
    Log in
  </button>

  <div class="toggle-container" style="display: flex; flex-direction: column; gap: 8px; margin-top: 15px;">
    <button class="btn btn-secondary" id="toggleBtn" onclick="toggleForm()">
      No account? Sign up!
    </button>

    <!-- Кнопка входа гостем для continueAsGuest() -->
    <button
      type="button"
      class="btn"
      style="background: transparent; border: 1px solid #333; color: #888; cursor: pointer; font-size: 0.8rem; padding: 6px; text-transform: uppercase;"
      onclick="continueAsGuest()"
    >
      Drive as Guest »
    </button>
  </div>
</div>

<div class="bg-game-subtitle">PORTAL</div>

</body>
</html>
