<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFS Portal | Leaderboard</title><link rel="icon" href="https://i.postimg.cc/htQQdS85/IMG-3707.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script defer="defer" src="js/leaderboard.js"></script></head><body class="leaderboard-page"><div class="cover-noise"></div><header class="top-navbar"><div style="display: flex; align-items: center; gap: 20px;"><img src="https://i.postimg.cc/5thfNj9K/IMG-3666.png" alt="NFS Logo" style="height: 65px; width: auto;"></div><div class="user-area" style="display: flex; align-items: center; gap: 20px;"><div class="notifications-wrapper" id="notifyWrapper" style="position: relative; display: flex; align-items: center;"><div id="notifyBell" onclick="toggleNotifyPopup()" style="cursor: pointer; display: flex; align-items: center;"><svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> <span id="notifyCount" style="margin-left: 5px;">0</span></div><div id="notifyPopup" style="display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a; border: 1px solid #333; z-index: 100; min-width: 200px; margin-top: 10px;"><div class="notify-header nfs-font" style="padding: 10px; color: #fff; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 0.8rem;">Notifications</div><div id="notifyList"></div></div></div><button class="btn-login" id="loginBtn" onclick="openModal()" style="display: none;">LOGIN</button><div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 15px;"><span id="displayNick" style="font-weight: bold; cursor: pointer; color: #ffffff;" onclick="window.location.href='profile.html'">Davenport </span><button onclick="handleLogout()" class="nfs-font btn-exit" style="background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 5px; color: #ff4444; cursor: pointer; font-size: 0.75rem; padding: 6px 12px; font-weight: bold; text-transform: uppercase;">EXIT</button></div></div></header><aside class="main-sidebar"><nav><a href="index.html" class="nav-item">MAIN</a> <a href="forum.html" class="nav-item">FORUM</a> <a href="chats.html" class="nav-item">MESSENGER<span id="msgBadge">0</span></a> <a href="leaderboard.html" class="nav-item active">LEADERBOARD</a> <a href="profile.html" class="nav-item">MY PROFILE</a></nav></aside><div class="container"><h1>LIST OF LEADER'S</h1><div class="leaderboard-frame-wrapper"><table class="blacklist-table"><thead><tr><th>PLACE</th><th>PHOTO</th><th>RACER</th><th>RATING</th><th>STATUS</th></tr></thead><tbody id="blacklistBody"></tbody></table></div><div class="pagination" id="pagination"></div></div><footer class="bottom-bar"><div>ONLINE: <span class="highlight" id="footerOnline">0</span> | YOU: <span id="footerUserBadge" class="status-guest">GUEST</span> <span id="footerAuthAction">(<a href="auth.html" style="color: var(--nfs-yellow, #f1c40f); text-decoration: none;">LOG IN</a>)</span> | <span class="support-link" onclick="openSupportModal()">Support<span id="supportAlertBadge"></span></span></div></footer><div class="modal-overlay" id="supportModalOverlay" onclick="closeSupportModal()"></div><div class="modal" id="supportModal" style="width: 450px; padding: 25px;"><h2 style="color: var(--nfs-yellow); text-transform: uppercase; font-style: italic; margin-top: 0;">Contact Support</h2><div id="supportReplyContainer" style="display:none; background: rgba(241, 196, 15, 0.05); border: 1px solid rgba(241, 196, 15, 0.2); border-left: 4px solid var(--nfs-yellow); padding: 15px; margin-bottom: 20px; text-align: left; border-radius: 4px; max-height: 200px; overflow-y: auto;"><div style="font-size: 0.75rem; color: #555; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">Ticket Subject:</div><div id="supportUserSubject" style="color: var(--nfs-yellow); font-weight: bold; font-size: 0.95rem; text-transform: uppercase; font-style: italic; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;"></div><div style="font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">Your Message:</div><p id="supportUserDescriptionText" style="margin: 0 0 12px 0; color: #ccc; font-size: 0.9rem; font-family: 'Arial', sans-serif !important; line-height: 1.4; white-space: pre-line;"></p><div id="adminResponseLabel" style="font-size: 0.75rem; color: var(--nfs-yellow); text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">Support Response:</div><p id="supportReplyText" style="margin: 0; color: #eee; font-size: 0.9rem; font-family: 'Arial', sans-serif !important; line-height: 1.4; white-space: pre-line;"></p><div id="closeTicketSection" style="margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); text-align: right;"><span onclick="closeAndArchieveTicket()" style="color: #888; font-size: 0.75rem; text-decoration: underline; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: color 0.2s;" onmouseover="this.style.color='#ff4444'" onmouseout="this.style.color='#888'">[✖] Close Ticket & Create New</span></div></div><div id="supportFormFields"><input id="supportSubject" placeholder="PROBLEM SUBJECT (e.g. Profile Error)"> <textarea id="supportDescription" rows="2" placeholder="Describe your issue in detail here..." style="font-family: 'Arial', sans-serif !important; resize: none;"></textarea> <button class="btn-login nfs-font" id="supportSubmitBtn" style="width: 100%; margin-top: 15px; border-radius: 8px; padding: 10px;" onclick="submitSupportTicket()">SEND TICKET</button></div></div></body></html>
